# ----------------------------------------------------------------
# Security headers (applied to every response)
# ----------------------------------------------------------------
add_header X-Frame-Options            "SAMEORIGIN"            always;
add_header X-Content-Type-Options     "nosniff"               always;
add_header X-XSS-Protection           "1; mode=block"         always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy
    "default-src 'self'; "
    "script-src 'self' 'unsafe-inline' 'unsafe-eval'; "
    "style-src 'self' 'unsafe-inline'; "
    "img-src 'self' data: blob: https:; "
    "font-src 'self' data:; "
    "connect-src 'self' ws: wss:; "
    "frame-ancestors 'none';"
    always;

# ----------------------------------------------------------------
# Backend API proxy
# ----------------------------------------------------------------
location /api/ {
    limit_req  zone=api_limit burst=20 nodelay;
    limit_conn conn_limit 20;

    proxy_pass         http://backend;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_read_timeout    300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;

    proxy_buffering    on;
    proxy_buffer_size  16k;
    proxy_buffers      8 16k;
}

# ----------------------------------------------------------------
# Authentication endpoints — stricter rate limit
# ----------------------------------------------------------------
location /api/auth/ {
    limit_req  zone=auth_limit burst=5 nodelay;
    limit_conn conn_limit 10;

    proxy_pass         http://backend;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
}

# ----------------------------------------------------------------
# WebSocket endpoint
# ----------------------------------------------------------------
location /ws/ {
    proxy_pass         http://backend;
    proxy_http_version 1.1;

    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;
}

# ----------------------------------------------------------------
# Static file storage (reports, uploads)
# ----------------------------------------------------------------
location /storage/ {
    alias /var/www/storage/;

    expires            30d;
    add_header Cache-Control "public, immutable";
    access_log         off;

    # Prevent directory listing
    autoindex off;
}

# ----------------------------------------------------------------
# Next.js static assets — long cache
# ----------------------------------------------------------------
location /_next/static/ {
    proxy_pass         http://frontend;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    expires            1y;
    add_header         Cache-Control "public, immutable";
    access_log         off;
}

# ----------------------------------------------------------------
# Next.js image optimisation endpoint
# ----------------------------------------------------------------
location /_next/image {
    proxy_pass         http://frontend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";

    expires            7d;
    add_header         Cache-Control "public";
}

# ----------------------------------------------------------------
# Public static files served by Next.js
# ----------------------------------------------------------------
location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|otf)$ {
    proxy_pass         http://frontend;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    expires            7d;
    add_header         Cache-Control "public";
    access_log         off;
}

# ----------------------------------------------------------------
# Frontend — all other requests
# ----------------------------------------------------------------
location / {
    proxy_pass         http://frontend;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_read_timeout    60s;
    proxy_connect_timeout 10s;

    # Pass Next.js HMR websocket in development
    proxy_set_header Upgrade $http_upgrade;
}
