# Alembic configuration file for bi-platform
# This file is used by the alembic CLI and the env.py script.

[alembic]
# Path to migration scripts, relative to this file's location.
script_location = .

# Template for generating new migration filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path manipulation so that models/ and app/ are importable.
# Adjust this to point to the backend package root.
prepend_sys_path = ../../backend

# Logging configuration — mirrors Python's logging.config.fileConfig format.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
